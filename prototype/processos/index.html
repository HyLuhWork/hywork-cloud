/* ---- Workflow tab ---- */
function stepIcon(step){
  if (step.id==='s_start') return ic('send',15);
  if (step.id==='s_end') return ic('flag',15);
  return '';
}
function ruleConditionText(r){
  if (r.isDefault || !r.condicoes || !r.condicoes.length || !r.condicoes[0].valor){
    return r.isDefault ? 'Padrão (senão)' : 'Sempre';
  }
  var c = r.condicoes[0];
  return 'SE '+c.campo+' '+c.operador+' '+c.valor;
}
var OP_SYMBOLS = {'maior ou igual a':'≥','maior que':'>','menor ou igual a':'≤','menor que':'<','igual a':'='};
function ruleConditionCompact(r){
  if (r.isDefault || !r.condicoes || !r.condicoes.length || !r.condicoes[0].valor) return r.isDefault ? 'Senão' : 'Sempre';
  var c = r.condicoes[0];
  return c.campo+' '+(OP_SYMBOLS[c.operador]||c.operador)+' '+c.valor;
}
function ruleSummaryLine(step, r){
  var dest = findStep(r.destinoStepId);
  var label = needsHuman(step.kind) && r.label ? '<b>'+esc(r.label)+'</b> · ' : '';
  var destTxt;
  if (dest) destTxt = '<b>'+esc(dest.name)+'</b>';
  else if (r.tipo==='mover_etapa') destTxt = '<em>escolhido ao agir</em>';
  else if (r.tipo==='personalizada') destTxt = '<em>via automação</em>';
  else destTxt = '<em>a definir</em>';
  return label + esc(ruleConditionCompact(r)) + ' → ' + destTxt;
}
function workflowTabHTML(){
  var d = currentData();
  var nodesHTML = d.steps.map(function(s){
    var selected = state.selectedStepId===s.id;
    var rules = s.regras || [];
    var rulesPreview = '';
    if (!s.system && rules.length){
      var shown = rules.slice(0,2);
      rulesPreview = '<div class="wf-rules-preview">'+shown.map(function(r){
        return '<div class="wfr-line">↳ '+ruleSummaryLine(s,r)+'</div>';
      }).join('')+(rules.length>2 ? '<div class="wfr-more">+'+(rules.length-2)+' regra(s)</div>' : '')+'</div>';
    }
    var icon = stepIcon(s);
    var colorStyle = s.cor ? ' style="border-left:4px solid '+esc(s.cor)+'"' : '';
    var menu = !s.system ? '<div class="step-card-menu">'+
      '<button class="icon-btn step-menu-btn" data-action="toggle-step-menu" data-id="'+s.id+'" title="Mais opções">'+ic('more',15)+'</button>'+
      (state.openStepMenuFor===s.id ? '<div class="step-menu-dropdown">'+
        '<button data-action="select-step" data-id="'+s.id+'">'+ic('edit',13)+'Editar Etapa</button>'+
        '<button class="danger" data-action="delete-step" data-id="'+s.id+'">'+ic('trash',13)+'Excluir Etapa</button>'+
      '</div>' : '')+
    '</div>' : '';
    return '<div class="wf-node step-card'+(selected?' selected':'')+(s.system?' system':'')+(s.final?' final':'')+'" data-action="select-step" data-id="'+s.id+'"'+colorStyle+'>'+
      (s.initial?'<span class="wf-tag">Etapa inicial</span>':'')+
      (s.final?'<span class="wf-tag-final">Etapa final</span>':'')+
      menu+
      '<div class="wf-node-top">'+(icon?'<div class="wf-ic">'+icon+'</div>':'')+
      '<div class="wf-text"><div class="wf-name" id="wf-name-'+s.id+'">'+esc(s.name)+'</div><div class="wf-sub">'+(s.system?'Etapa do sistema':(needsHuman(s.kind)&&s.responsavel?respLabel(s.responsavel):(s.kind==='condicao'?'Decisão automática':'Sem responsável definido')))+'</div></div></div>'+
      rulesPreview+
    '</div>';
  }).join('');

  return '<div class="wf-layout">'+
    '<div class="wf-canvas-wrap"><div class="steps-board">'+
      nodesHTML+
      '<button class="wf-add" data-action="open-add-step">'+ic('plus',15)+'Adicionar Etapa</button>'+
    '</div></div>'+
  '</div>';
}

  if (!isSystem) tabs.push(['acoes','Ações','fork']);

  else if (state.stepModalTab==='sla') body = !needsHuman(step.kind) ? '<div class="field-hint">Etapas do tipo Condição não têm prazo — são resolvidas instantaneamente pelo sistema.</div>' : (step.slaNone ? '<div class="field-hint">Esta etapa não tem SLA definido — não há prazo de atendimento associado.</div>' : stepModalSlaHTML(step));

function stepAcoesTabHTML(step){

    ? 'Quais ações o responsável desta etapa pode ter? Cada ação é um botão que ele vê, e define para qual etapa a solicitação é movida.'
    : 'Esta etapa não tem responsável humano — as regras abaixo definem para qual etapa o sistema move a solicitação automaticamente, de acordo com as condições.';
  return '<div class="field-hint" style="margin-bottom:14px">'+intro+'</div>'+rulesListHTML(step);
}
function ruleSentenceHTML(step, r){
  var dest = findStep(r.destinoStepId);
  var destTxt = dest ? '<b>'+esc(dest.name)+'</b>' : '<em>escolha uma etapa</em>';
  var condTxt = '';
  if (!r.isDefault && r.condicoes && r.condicoes.length && r.condicoes[0].valor){
    var c = r.condicoes[0];
    condTxt = 'Se <b>'+esc(c.campo)+'</b> for '+esc(c.operador)+' <b>'+esc(c.valor)+'</b>, ';
  }
  if (r.tipo==='aprovar') return condTxt + (condTxt ? 'a solicitação é aprovada e avança para ' : 'Ao aprovar, avança para ') + destTxt + '.';
  if (r.tipo==='reprovar') return condTxt + (condTxt ? 'a solicitação é reprovada' : 'Ao reprovar') + (r.exigirJustificativa ? ', com justificativa obrigatória,' : '') + ' e move para '+destTxt+'.';
  if (r.tipo==='mover_etapa') return 'O responsável escolhe, no momento de agir, para qual etapa mover a solicitação.';
  if (r.tipo==='devolver_solicitante') return 'Devolve a solicitação ao solicitante ('+destTxt+')'+(r.exigirJustificativa ? ', com justificativa obrigatória,' : '')+' para corrigir e reenviar.';
  var parts = [];
  if (r.isDefault) parts.push('Sempre que nenhuma outra ação valer');
  else if (condTxt) parts.push(condTxt.replace(/, $/,''));
  else parts.push('Sempre');
  var camposObrig = (r.exigirPreenchimento && r.camposPreenchimentoIds && r.camposPreenchimentoIds.length)
    ? allProcessFields().filter(function(f){return r.camposPreenchimentoIds.indexOf(f.id)!==-1;}) : [];
  var moveTxt = r.destinoStepId ? 'move a solicitação para '+destTxt : null;
  var campoTxt = camposObrig.length ? 'exige o preenchimento de '+camposObrig.map(function(f){return '<b>'+esc(f.label)+'</b>';}).join(', ') : null;
  var actionTxt = [moveTxt, campoTxt].filter(Boolean).join(' e ') || (dest ? 'move a solicitação para '+destTxt : 'conclui a ação — o destino é definido por uma automação deste processo');
  return parts[0]+', '+actionTxt+'.';
}

      '<label class="switch"><input type="checkbox" data-bind="rule.exigirJustificativa" data-stepid="'+step.id+'" data-regraid="'+r.id+'" '+(r.exigirJustificativa?'checked':'')+'/><span class="track"><span class="thumb"></span></span></label></div>'+
      '<div class="rule-mini-label">Mudar automaticamente para a etapa final</div>'+

        '<option value="">Escolher etapa final…</option>'+destOptions2+
      '</select></div>';
  } else if (r.tipo==='mover_etapa'){
    body = '<div class="field-hint" style="margin:0">O responsável desta etapa escolhe, no momento de agir, para qual etapa do processo mover a solicitação — não é preciso configurar um destino aqui.</div>';
  } else if (r.tipo==='devolver_solicitante'){
    var startStep = findStep('s_start') || findStep(r.destinoStepId);
    body = '<div class="rule-mini-label" style="margin-top:0">Retorna para</div><div class="rule-dest-readonly">'+ic('arrowLeft',13)+esc(startStep?startStep.name:'Formulário enviado')+'</div>'+
      '<div class="switch-row"><div class="sr-text"><div class="sr-title">Exigir justificativa/motivo</div><div class="sr-sub">Pede um texto explicando o que precisa ser corrigido</div></div>'+
      '<label class="switch"><input type="checkbox" data-bind="rule.exigirJustificativa" data-stepid="'+step.id+'" data-regraid="'+r.id+'" '+(r.exigirJustificativa?'checked':'')+'/><span class="track"><span class="thumb"></span></span></label></div>';
  } else {
    var labelField = '<div class="field-row" style="margin-bottom:10px"><input class="input" placeholder="Nome da ação" data-bind="rule.label" data-stepid="'+step.id+'" data-regraid="'+r.id+'" value="'+esc(r.label||'')+'"/></div>';
    var camposDisp = allProcessFields();

    }).join('');
    var exigirCampoBlock = '<div class="switch-row"><div class="sr-text"><div class="sr-title">Exigir preenchimento de campo</div><div class="sr-sub">Ex: se Tipo de solicitação for X, pede que o responsável preencha um ou mais campos específicos antes de confirmar</div></div>'+
      '<label class="switch"><input type="checkbox" data-bind="rule.exigirPreenchimento" data-stepid="'+step.id+'" data-regraid="'+r.id+'" '+(r.exigirPreenchimento?'checked':'')+'/><span class="track"><span class="thumb"></span></span></label></div>'+
      (r.exigirPreenchimento ? (camposDisp.length ?

        '<option value="">Não mudar de etapa…</option>'+destOptions3+

      (addingStep ? newStepInlineHTML(step, r) : '');
    body = labelField + exigirCampoBlock + destBlock;
  }

  var sentence = '<div class="rule-sentence">'+ruleSentenceHTML(step,r)+'</div>';

function parseDataBR(s){
  if (!s) return 0;
  var parts = s.split('/');
  if (parts.length!==3) return 0;
  return new Date(+parts[2], +parts[1]-1, +parts[0]).getTime();
}
function tipoSolicitacaoField(d){
  return d.formFields.find(function(f){return f.label==='Tipo de solicitação';}) ||
    d.formFields.find(function(f){return f.label==='Prioridade';});
}
function priorityBadgeClass(val){ return /urgente|crítica/i.test(val) ? 'badge-danger' : (/alta/i.test(val) ? 'badge-warning' : 'badge-info'); }
function pvFilteredSortedSolicitacoes(d){
  var sols = (d.solicitacoes||[]).filter(function(sol){
    if (state.pvFilterSteps && state.pvFilterSteps.indexOf(sol.stepId)===-1) return false;
    if (state.pvSearch && sol.solicitante.toLowerCase().indexOf(state.pvSearch.toLowerCase())===-1) return false;
    return true;
  });
  sols = sols.slice();
  if (state.pvSort==='solicitante') sols.sort(function(a,b){ return a.solicitante.localeCompare(b.solicitante); });
  else sols.sort(function(a,b){ return parseDataBR(b.criadoEm)-parseDataBR(a.criadoEm); });
  return sols;
}

function pvGroupedSolicitacoes(d, sols){
  if (state.pvGroupBy==='solicitante'){
    var byName = {};
    sols.forEach(function(sol){ (byName[sol.solicitante] = byName[sol.solicitante]||[]).push(sol); });
    return Object.keys(byName).sort(function(a,b){return a.localeCompare(b);}).map(function(name){
      return {key:'nome-'+name, label:name, cor:null, items:byName[name], stepId:null};
    });
  }
  if (state.pvGroupBy==='responsavel'){
    var byResp = {};
    sols.forEach(function(sol){
      var step = findStep(sol.stepId);
      var label = (step && step.responsavel && step.responsavel.valor) || 'Sem responsável';
      (byResp[label] = byResp[label]||[]).push(sol);
    });
    return Object.keys(byResp).sort(function(a,b){return a.localeCompare(b);}).map(function(name){
      return {key:'resp-'+name, label:name, cor:null, items:byResp[name], stepId:null};
    });
  }
  return d.steps.map(function(s){
    return {key:s.id, label:s.name, cor:s.cor, items: sols.filter(function(sol){return sol.stepId===s.id;}), stepId:s.id};
  });
}

var MONTH_NAMES_PT = ['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
function miniCalendarHTML(markedDays){
  var now = new Date();
  var year = now.getFullYear(), month = now.getMonth(), today = now.getDate();
  var first = new Date(year, month, 1);
  var startOffset = first.getDay();
  var daysInMonth = new Date(year, month+1, 0).getDate();
  var daysInPrevMonth = new Date(year, month, 0).getDate();
  var cells = [];
  for (var i=0;i<startOffset;i++) cells.push({day: daysInPrevMonth-startOffset+1+i, muted:true});
  for (var d=1; d<=daysInMonth; d++) cells.push({day:d, muted:false, today:d===today});
  var nextDay = 1;
  while (cells.length % 7 !== 0){ cells.push({day:nextDay++, muted:true}); }
  var weekLabels = ['D','S','T','Q','Q','S','S'];
  var head = weekLabels.map(function(w){return '<div class="mcal-wd">'+w+'</div>';}).join('');
  var body = cells.map(function(c){
    var marked = !c.muted && (markedDays||[]).indexOf(c.day)!==-1;
    return '<div class="mcal-cell'+(c.muted?' muted':'')+(c.today?' today':'')+'">'+c.day+(marked?'<span class="mcal-dot"></span>':'')+'</div>';
  }).join('');
  return '<div class="mcal">'+
    '<div class="mcal-toolbar"><span class="mcal-month">'+MONTH_NAMES_PT[month]+' de '+year+ic('chevronDown',11)+'</span><div class="mcal-arrows"><span>«</span><span>‹</span><span>›</span><span>»</span></div></div>'+
    '<div class="mcal-head">'+head+'</div><div class="mcal-body">'+body+'</div>'+
  '</div>';
}

function diasDesde(dataStr){
  var t = parseDataBR(dataStr);
  if (!t) return 0;
  return Math.floor((Date.now()-t)/(1000*60*60*24));
}
function slaDiasFor(step){
  if (!step || !step.sla) return null;
  var s = step.sla;
  return s.unidade==='horas' ? s.prazo/24 : s.prazo;
}
function openSolicitacoes(){
  return allSolicitacoesFlat().filter(function(x){
    var step = findStepIn(x.processo, x.sol.stepId);
    return step && !step.final;
  });
}

function intranetPendenciasDashboardHTML(pid){
  var pend = pid ? filaAprovacaoFor(pid) : filaAprovacao();
  var atendidas = pid ? historicoFinalizadasFor(pid) : historicoFinalizadas();
  var urgentCount = pend.filter(function(x){
    var d = state.processData[x.processo.id];
    var tf = tipoSolicitacaoField(d);
    var v = tf ? x.sol.valores[tf.id] : null;
    return v && /urgente|crítica/i.test(v);
  }).length;
  var avgWait = pend.length ? (pend.reduce(function(sum,x){ return sum+diasDesde(x.sol.criadoEm); },0)/pend.length) : 0;
  var avgWaitStr = pend.length ? avgWait.toFixed(1).replace('.',',')+' dias' : '—';

  var kpis = [
    {label:'Pendentes', value:String(pend.length), trend:'Aguardando decisão'},
    {label:'Atendidas', value:String(atendidas.length), trend:'Total finalizado'},
    {label:'Urgentes', value:String(urgentCount), trend:'Marcadas como urgente'},
    {label:'Tempo médio de espera', value:avgWaitStr, trend:'Desde a criação'}
  ];
  var kpisHTML = kpis.map(function(k,i){ return widgetHTML({type:'kpi', id:'intranet-kpi-'+i, label:k.label, value:k.value, trend:k.trend}, true); }).join('');

  var vencendoRaw = pend.map(function(x){
    var step = findStepIn(x.processo, x.sol.stepId);
    var prazoDias = slaDiasFor(step);
    if (prazoDias==null) return null;
    var restante = Math.round(prazoDias - diasDesde(x.sol.criadoEm));
    return {x:x, restante:restante};
  }).filter(Boolean);
  vencendoRaw.sort(function(a,b){ return a.restante-b.restante; });
  var vencendoTop;
  if (vencendoRaw.length<=6) vencendoTop = vencendoRaw;
  else {
    var step = vencendoRaw.length/6;
    vencendoTop = [];
    for (var vi=0; vi<6; vi++) vencendoTop.push(vencendoRaw[Math.floor(vi*step)]);
  }
  var vencendoHTML = vencendoTop.length ? '<div class="chart-card widget-shell"><div class="cc-label">Solicitações prestes a vencer</div>'+
    vencendoTop.map(function(v){
      var restante = v.restante;
      var badgeClass = restante<=0 ? 'badge-danger' : (restante<=2 ? 'badge-warning' : 'badge-info');
      var label = restante<0 ? 'vencida há '+Math.abs(restante)+'d' : (restante===0 ? 'vence hoje' : 'vence em '+restante+'d');
      return '<div class="venc-row" style="cursor:pointer" data-action="open-request-from-list" data-solid="'+v.x.sol.id+'" data-pid="'+v.x.processo.id+'"><span class="vr-name">'+esc(v.x.sol.solicitante)+' · '+esc(v.x.processo.name)+'</span><span class="badge '+badgeClass+'">'+esc(label)+'</span></div>';
    }).join('')+
  '</div>' : chartEmptyCardHTML('Solicitações prestes a vencer', 'Nenhuma solicitação com prazo definido no momento.');

  var open = pid ? openSolicitacoesFor(pid) : openSolicitacoes();
  var byGroup = {};
  open.forEach(function(x){
    var key = pid ? ((findStepIn(x.processo, x.sol.stepId)||{}).name || '—') : x.processo.name;
    byGroup[key] = (byGroup[key]||0)+1;
  });
  var barData = Object.keys(byGroup).map(function(k){ return {name:k, value:byGroup[k]}; });
  var barLabel = pid ? 'Solicitações em aberto por etapa' : 'Todas as solicitações em aberto';
  var barHTML = barData.length ? widgetHTML({type:'bar', id:'intranet-bar-open', label:barLabel, data:barData}, true) : chartEmptyCardHTML(barLabel, 'Nenhuma solicitação em aberto no momento.');

  return '<div class="widget-grid" style="margin-bottom:22px">'+kpisHTML+vencendoHTML+barHTML+'</div>';
}

function condicaoSummaryText(bloco){
  var grupos = bloco.grupos || [];
  var first = grupos[0] && grupos[0].condicoes[0];
  if (!first || !first.valor) return 'Condição não definida ainda';
  var total = grupos.reduce(function(a,g){return a+g.condicoes.length;},0);
  var txt = first.campo+' '+first.operador+' '+first.valor;
  if (grupos.length>1) txt += ' ('+grupos.length+' grupos)';
  else if (total>1) txt += ' (+'+(total-1)+')';
  return txt;
}

function parseMoney(v){ if (v==null) return null; if (typeof v==='number') return v; var n = parseFloat(String(v).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.')); return isNaN(n)?null:n; }
function condPasses(cond, values){
  if (!cond || !cond.valor) return false;
  var actual = values[cond.campo];
  var a = parseMoney(actual), b = parseMoney(cond.valor);
  if (a==null || b==null) return false;
  switch(cond.operador){
    case 'maior ou igual a': return a>=b;
    case 'maior que': return a>b;
    case 'menor ou igual a': return a<=b;
    case 'menor que': return a<b;
    case 'igual a': return a===b;
  }
  return false;
}
function traceFlow(values){
  var d = currentData();
  var path = []; var cur = d.steps.find(function(s){return s.initial;});
  var guard = 0;
  while (cur && guard < 12){
    guard++;
    var chosen = null, chosenRule = null;
    var rules = cur.regras || [];
    for (var i=0;i<rules.length;i++){
      var r = rules[i];
      if (r.isDefault) continue;
      if (r.condicoes && r.condicoes.length && condPasses(r.condicoes[0], values)){ chosen = r; chosenRule = ruleConditionText(r); break; }
    }
    if (!chosen) { chosen = rules.find(function(r){return r.isDefault;}); chosenRule = chosen ? (needsHuman(cur.kind)&&chosen.label ? chosen.label : 'Padrão') : null; }
    path.push({step:cur, ruleText: cur.system ? null : chosenRule});
    if (cur.final) break;
    var next = chosen ? findStep(chosen.destinoStepId) : null;
    if (!next && !cur.final){
      var idx = d.steps.indexOf(cur);
      next = d.steps[idx+1] || null;
    }
    if (!next || next.id===cur.id) break;
    cur = next;
  }
  return path;
}

function runPublishAnimation(){
  render();
  clearTimeout(runPublishAnimation._t1); clearTimeout(runPublishAnimation._t2); clearTimeout(runPublishAnimation._t3);
  runPublishAnimation._t1 = setTimeout(function(){ state.publishAnimStage=1; render(); }, 1000);
  runPublishAnimation._t2 = setTimeout(function(){ state.publishAnimStage=2; render(); }, 2000);
  runPublishAnimation._t3 = setTimeout(function(){
    currentProcess().status='published';
    currentProcess().version=(currentProcess().version||1)+1;
    state.publishAnimating=false;
    state.screen='processview';
    state.processViewTab='kanban';
    showToast('Processo publicado com sucesso!');
    render();
  }, 3000);

function renderPublishAnim(){
  var root = qs('#publish-anim-root');
  if (!state.publishAnimating){ if(root.innerHTML) root.innerHTML=''; return; }
  root.innerHTML = publishAnimHTML();
}
function publishAnimHTML(){
  var d = currentData();
  var stage = state.publishAnimStage;
  var steps = d.steps.filter(function(s){return !s.system;});
  var stepChips = steps.map(function(s,i){
    return '<div class="panim-chip" style="animation-delay:'+(i*160)+'ms">'+ic('flow',12)+esc(s.name)+'</div>';
  }).join('');
  var respSteps = steps.filter(function(s){return needsHuman(s.kind)&&s.responsavel;});
  var respChips = respSteps.map(function(s,i){
    var label = s.responsavel.valor || s.responsavel.tipo;
    return '<div class="panim-avatar" style="animation-delay:'+(i*160)+'ms" title="'+esc(label)+' · '+esc(s.name)+'">'+esc(label.slice(0,2).toUpperCase())+'</div>';
  }).join('');
  var labels = ['Montando as etapas do workflow…','Definindo responsáveis por etapa…','Publicando o processo…'];
  var stageLabel = labels[stage] || labels[labels.length-1];
  var body = '<div class="panim-row">'+stepChips+'</div>';
  if (stage>=1) body += '<div class="panim-row panim-avatars">'+respChips+'</div>';
  if (stage>=2) body += '<div class="panim-progress"><div class="panim-progress-bar"></div></div>';
  return '<div class="publish-anim-overlay">'+
    '<div class="publish-anim-card">'+
      '<div class="panim-spinner"></div>'+
      '<div class="panim-stage-label">'+esc(stageLabel)+'</div>'+
      body+
    '</div>'+
  '</div>';
}

      reader.onload = function(ev){ currentData().formConfig.capa = ev.target.result; render(); };
      reader.readAsDataURL(file);
    }
    return;
  }
  var el = e.target.closest('[data-bind]');
  if (!el) return;
  if (el.tagName==='INPUT' && el.type!=='checkbox' && el.type!=='color') return;
  if (el.tagName==='TEXTAREA') return;
  var bind = el.dataset.bind;
  var val = el.type==='checkbox' ? el.checked : el.value;
  var matched = true;
  if (bind==='p.category') currentProcess().category = val;
  else if (bind==='wizard.category') state.wizardDraft.category = val;
  else if (bind==='step.resp_tipo') { var s=findStep(el.dataset.stepid); s.responsavel=s.responsavel||{}; s.responsavel.tipo=val; s.responsavel.valor = respTypeMeta(val).options[0]; }
  else if (bind==='step.resp_valor') { var s2=findStep(el.dataset.stepid); s2.responsavel.valor=val; }
  else if (bind==='step.sla_unidade') { var s3=findStep(el.dataset.stepid); s3.sla=s3.sla||{}; s3.sla.unidade=val; }
  else if (bind==='step.sla_vencer') { var s4=findStep(el.dataset.stepid); s4.sla.aoVencer=val; }
  else if (bind==='step.cor') { var s5=findStep(el.dataset.stepid); s5.cor=val||null; }
  else if (bind==='field.required') { var f=currentData().formFields.find(function(x){return x.id===el.dataset.id;}); f.required=val; }
  else if (bind==='field.conditional') { var f2=currentData().formFields.find(function(x){return x.id===el.dataset.id;}); f2.conditional=val; }
  else if (bind==='field.coluna') { var fcol=currentData().formFields.find(function(x){return x.id===el.dataset.id;}); fcol.coluna=+val; }
  else if (bind==='rule.destino') { var r=findRegra(el.dataset.stepid, el.dataset.regraid); r.destinoStepId=val||null; }
  else if (bind==='rule.condCampo') { var r2=findRegra(el.dataset.stepid, el.dataset.regraid); r2.condicoes[0]=r2.condicoes[0]||{}; r2.condicoes[0].campo=val; }
  else if (bind==='rule.condOp') { var r3=findRegra(el.dataset.stepid, el.dataset.regraid); r3.condicoes[0]=r3.condicoes[0]||{}; r3.condicoes[0].operador=val; }
  else if (bind==='rule.exigirJustificativa') { var r5=findRegra(el.dataset.stepid, el.dataset.regraid); r5.exigirJustificativa=val; }
  else if (bind==='rule.exigirPreenchimento') { var r6=findRegra(el.dataset.stepid, el.dataset.regraid); r6.exigirPreenchimento=val; }
  else if (bind==='sol.checklist') {
    var sol8=findSolicitacao(el.dataset.solid);
    var arr8 = Array.isArray(sol8.valores[el.dataset.fieldid]) ? sol8.valores[el.dataset.fieldid] : [];
    var pos8 = arr8.indexOf(el.dataset.item);
    if (val && pos8===-1) arr8 = arr8.concat([el.dataset.item]);
    else if (!val && pos8!==-1) arr8 = arr8.filter(function(x){return x!==el.dataset.item;});
    sol8.valores[el.dataset.fieldid] = arr8;
  }
  else if (bind==='automacao.evento_tipo') { var auT=findAutomacao(el.dataset.autoid); auT.evento = {tipo:val}; }
  else if (bind==='automacao.evento_campo') { var au1=findAutomacao(el.dataset.autoid); au1.evento.campoId=val; }
  else if (bind==='automacao.evento_etapa') { var au2=findAutomacao(el.dataset.autoid); au2.evento.etapaId=val; }
  else if (bind==='automacao.evento_regra') { var au3=findAutomacao(el.dataset.autoid); au3.evento.regraId=val; }
  else if (bind==='automacao.condCampo') { var b1=findAutomacaoBloco(el.dataset.autoid, el.dataset.blockid); var g1=b1.grupos.find(function(g){return g.id===el.dataset.groupid;}); g1.condicoes[+el.dataset.idx].campo=val; }
  else if (bind==='automacao.condOp') { var b2=findAutomacaoBloco(el.dataset.autoid, el.dataset.blockid); var g2=b2.grupos.find(function(g){return g.id===el.dataset.groupid;}); g2.condicoes[+el.dataset.idx].operador=val; }
  else if (bind==='automacao.acaoAlvo') { var b3=findAutomacaoBloco(el.dataset.autoid, el.dataset.blockid); if(b3) b3.alvo=val; }
  else if (bind==='reqdraft.destino') { state.reqActionDrafts[el.dataset.tipo] = state.reqActionDrafts[el.dataset.tipo]||{}; state.reqActionDrafts[el.dataset.tipo].destino=val; }
  else if (bind==='novasol.campo') { state.novaSolicitacaoDraft.valores[el.dataset.fieldid]=val; }
  else if (bind==='sol.campo') { var sol9=findSolicitacao(el.dataset.solid); sol9.valores[el.dataset.fieldid]=val; }
  else if (bind==='dslink.fonte') {
    state.dsLinkDraft.fonteId = val || null;
    var dsFonteSel = val ? dataSourceById(val) : null;
    state.dsLinkDraft.camposIds = dsFonteSel ? dsFonteSel.fields.map(function(f){return f.id;}) : [];
  }
  else if (bind==='fonterecord.campo') { state.fonteRecordDraft.valores[el.dataset.fieldid]=val; }
  else if (bind==='dsautomacao.fonte') { var dsaF=currentDsAuto(); dsaF.fonteId=val; dsaF.evento={tipo:'item_criado'}; }
  else if (bind==='dsautomacao.evento_tipo') { var dsaE=currentDsAuto(); dsaE.evento={tipo:val}; }
  else if (bind==='dsautomacao.evento_campo') { var dsaC=currentDsAuto(); dsaC.evento.campoId=val||null; dsaC.evento.valores=[]; }
  else if (bind==='dsautomacao.condCampo') { var dsaCB=findDsBlocoIn(currentDsAuto(), el.dataset.blockid); var dsaCG=dsaCB.grupos.find(function(g){return g.id===el.dataset.groupid;}); dsaCG.condicoes[+el.dataset.idx].campo=val; }
  else if (bind==='dsautomacao.condOp') { var dsaOB=findDsBlocoIn(currentDsAuto(), el.dataset.blockid); var dsaOG=dsaOB.grupos.find(function(g){return g.id===el.dataset.groupid;}); dsaOG.condicoes[+el.dataset.idx].operador=val; }
  else if (bind==='dsautomacao.acaoAlvo') { var dsaAB=findDsBlocoIn(currentDsAuto(), el.dataset.blockid); dsaAB.alvo=val; }
  else matched = false;
  if (matched) render();
});

    else if (bind==='reqdraft.justificativa'){ state.reqActionDrafts[el.dataset.tipo] = state.reqActionDrafts[el.dataset.tipo]||{}; state.reqActionDrafts[el.dataset.tipo].justificativa=val; }
    else if (bind==='novasol.campo'){ state.novaSolicitacaoDraft.valores[el.dataset.fieldid]=val; }

function setText(sel, val){ var n = document.querySelector(sel); if (n) n.textContent = val; }

/* drag and drop: palette -> canvas */
document.addEventListener('dragstart', function(e){
  var el = e.target.closest('.palette-item');
  if (el){ e.dataTransfer.setData('text/plain', el.dataset.fieldtype); return; }
});
document.addEventListener('dragover', function(e){
  var zone = e.target.closest('.fb-col-drop');
  if (zone){ e.preventDefault(); zone.classList.add('drag-over'); }
});
document.addEventListener('dragleave', function(e){
  var zone = e.target.closest('.fb-col-drop');
  if (!zone){
    Array.prototype.forEach.call(document.querySelectorAll('.fb-col-drop.drag-over'), function(z){ z.classList.remove('drag-over'); });
  }
});
document.addEventListener('drop', function(e){
  var zone = e.target.closest('.fb-col-drop');
  if (!zone) return;
  e.preventDefault();
  Array.prototype.forEach.call(document.querySelectorAll('.fb-col-drop.drag-over'), function(z){ z.classList.remove('drag-over'); });
  var type = e.dataTransfer.getData('text/plain');
  if (!type) return;
  var f;
  if (type==='section'){
    f = {id:uid(), type:'section', titulo:'Nova seção', descricao:''};
  } else {
    var meta = fieldTypeMeta(type);
    f = {id:uid(), type:type, label:meta.label, required:false, coluna:+(zone.dataset.coluna||1)};
  }
  currentData().formFields.push(f);
  state.fieldModalOpen = f.id;
  render();
});

/* theme toggle */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-theme-choice]');
  if (!b) return;
  var choice = b.dataset.themeChoice;
  state.theme = choice;
  document.documentElement.setAttribute('data-theme', choice);
  updateThemeToggle();
});

/* HyA Builder — mocked entry point, no real AI behind it yet */
document.addEventListener('keydown', function(e){
  if (e.target && e.target.id==='hya-input' && e.key==='Enter'){
    e.preventDefault();
    showToast('HyA Builder (IA) chega em breve — isso aqui é só uma prévia visual.');
    render();
  }
});

render();
})();
